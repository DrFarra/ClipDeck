name: ClipDeck
options:
  bundleIdPrefix: com.emilio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ClipDeck:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.clipdeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClipDeck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.emilio.clipdeck
            CFBundleURLSchemes: [clipdeck]
        NSFaceIDUsageDescription: "ClipDeck usa Face ID para proteger tu historial del portapapeles."
        NSPhotoLibraryAddUsageDescription: "ClipDeck necesita permiso para guardar imágenes de tu historial en Fotos."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/ClipDeck.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.emilio.clipdeck
    dependencies:
      - target: ClipDeckKeyboard
      - target: ClipDeckShare
      - target: ClipDeckWidget

  ClipDeckKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.clipdeck.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Teclado ClipDeck
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: es-ES
    entitlements:
      path: Keyboard/ClipDeckKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.emilio.clipdeck

  ClipDeckShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.clipdeck.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: ClipDeck
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Share/ClipDeckShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.emilio.clipdeck

  ClipDeckWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.clipdeck.widget
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ClipDeck Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClipDeckWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.emilio.clipdeck

schemes:
  ClipDeck:
    build:
      targets:
        ClipDeck: all
    run:
      config: Debug
    archive:
      config: Release
